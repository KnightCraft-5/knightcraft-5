name: validate

# Cheap structural checks. No secrets, no mods download - these run on every
# push so a broken quest book or an invented config key is caught before it
# reaches a release.
#
# The checks live in ./preflight.sh, NOT inline here, so what CI runs and what a
# human runs before tagging are the same list and cannot drift. A release was
# once tagged against a tree whose quest book did not validate: the check had
# been run locally several times, but always piped into `tail`, and `$?` after a
# pipeline is the exit status of the LAST command - so the validator's failure
# and its stderr were both swallowed, and it only surfaced when Actions ran the
# command bare.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # preflight.sh runs each check bare and prints a pass/fail line per check,
      # so a red build names the offending check rather than just a shell line.
      - name: Preflight
        run: ./preflight.sh
